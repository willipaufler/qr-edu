site_name: QR - Aufgaben
site_url: https://qr-summe.de
theme:
  name: material
  font: false #Deaktiviert um Konflikt mit extra.css zu vermeiden
  features:
    - navigation.footer
  icon:
    logo: material/account-school-outline
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: orange

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: orange
  

# Emojis ans Icons
markdown_extensions:
  - def_list
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Extension for code
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Admonition
  - admonition
  - pymdownx.details
  # Katex
  - pymdownx.arithmatex:
      generic: true
  # Images
  - md_in_html
  - pymdownx.blocks.caption

copyright: Copyright &copy; 2026  Dr. Willi Paufler


extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js


extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0/dist/katex.min.css



nav:
  - Home: index.md
  - Mathe Sek I:
      - Potenzfunktionen: ma_sek_I/potenzfunktion/index.md
      # Die Tipps und Lösungen werden hier einfach nicht erwähnt.
  - Mathe Sek II:
      - Differentialrechnung:
        - 1. Grundlagen Funktionen: ma_sek_II/diff/basic/index.md
        - 2. Ableitungen: ma_sek_II/diff/abl/index.md
        - 3. Tangenten, Normalen & Winkel: ma_sek_II/diff/tnw/index.md
        - 4. Kurvendiskussion: ma_sek_II/diff/kd/index.md
        - 5. Extremwertprobleme: ma_sek_II/diff/ewp/index.md
        - 6. Rekonstruktion: ma_sek_II/diff/rek/index.md
      - Integralrechnung:
        - 1. Bestimmtes und unbestimmtes Integral: ma_sek_II/int/basic/index.md
        - 2. Flächenberechnung: ma_sek_II/int/flaeche/index.md
        - 3. Volumenberechnung: ma_sek_II/int/vol/index.md
        - 4. Rekonstruktion von Beständen: ma_sek_II/int/rek/index.md
      - Vektorrechnung:
        - 1. Punkte und Vektoren: ma_sek_II/vek/basic/index.md
